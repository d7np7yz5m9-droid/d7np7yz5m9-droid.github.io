<body style="font-family: monospace; padding: 30px; background-color: #000; color: #00ff99;">

<h3>// final_output</h3>

<p id="typing"></p>

<script>
const text = `
if (Archita_smiles) {
    my_heart = happy;
}

You are the constant I never want to change.
No bugs.
No errors.
Just real feelings ❤️
`;

let i = 0;

function typeWriter() {
  if (i < text.length) {
    document.getElementById("typing").innerHTML += text.charAt(i);
    i++;
    setTimeout(typeWriter, 30);
  }
}

typeWriter();
</script>
